name: CanTheySeeIt test-1 checks

on:
  push:
    branches: [test-1]
    paths:
      - 'test-1/**'
      - '.github/workflows/cantheyseeit-test-1.yml'
  pull_request:
    branches: [test-1]
    paths:
      - 'test-1/**'
      - '.github/workflows/cantheyseeit-test-1.yml'

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./test-1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Run backend smoke tests
        run: npm test
      - name: Build frontend
        run: npm run build
